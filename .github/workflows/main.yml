name: Get YouTube Token

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Authorization code from Google'
        required: true
        type: string

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Get YouTube Token
        run: python3 get_token.py "${{ github.event.inputs.auth_code }}"
