name: Robot Auto TikTok to YouTube

on:
  schedule:
    - cron: '0 * * * *' # S'exécute automatiquement toutes les heures
  workflow_dispatch: # Vous permet de le lancer à la main quand vous voulez

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les outils nécessaires
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 yt-dlp pyktok instaloader

      - name: Lancer la republication (Toutes les vidéos)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
        run: |
          # Ici le robot télécharge tout votre historique
          yt-dlp "https://tiktok.com" --download-archive /tmp/archive.txt
          python main.py
